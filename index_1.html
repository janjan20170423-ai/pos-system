<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
    <link rel="icon" type="image/png" href="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse3.mm.bing.net%2Fth%2Fid%2FOIP.ryKm2keuRa-_2ydvnGUsVgAAAA%3Fr%3D0%26pid%3DApi&f=1&ipt=9ecef78e0455661433179a352def747d41c8bb05ad1812968d455168d97d7c3b&ipo=images">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>享點 POS 點餐系統</title>
<meta property="og:title" content="享點 POS 點餐系統">

<meta property="og:description"
content="歡迎使用">

<meta property="og:image"
content="https://janjan20170423-ai.github.io/pos-system/2026-05-28 15.41.19 janjan20170423-ai.github.io 47785fec6c5b1.jpg">

<meta property="og:url"
content="https://janjan20170423-ai.github.io/pos-system/">
<style>
html, body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

#pageFrame{
  position:absolute;
  inset:0;           /* 全螢幕 POS */
  border:none;
  width:100%;
  height:100%;
}

#qaDrawer{
  position:fixed;
  top:0;
  right:0;
  height:100vh;
  width:0;           /* 收合時不佔空間 */
  z-index:9999;
  transition: width 220ms ease;
  background: transparent;
  overflow:hidden;
}

#qaDrawer.open{
  width:300px;       /* 展開寬度：可自行調 */
  background: transparent;
}

/* 抽屜裡真正顯示的 iframe */
#qaFrame{
  width:300px;       /* 跟 open 的 width 一致比較好 */
  height:100%;
  border:none;
  box-shadow: -6px 0 18px rgba(0,0,0,0.25);
  background:#fff;
  border-left: 1px solid rgba(0,0,0,0.08);
}

/* 右下角或右側收合/展開按鈕（可選） */
    #qaToggle {
    right: 12px;
    position: fixed;
    left: 10px;
    bottom: 250px;
    z-index: 999;

    width: 60px;
    height: 60px;
    background-color: #eee;
    color: #777;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 11px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    transition: transform 0.2s;
    border: 0px solid #ddd;    
}
    #qaToggle img{
        width:18px; 
        height:18px;
    }
</style>
</head>

<body>

  <iframe id="pageFrame" src="about:blank"></iframe>

  <button id="qaToggle" type="button" aria-label="提問專區">
  <img src="https://cdn-icons-png.flaticon.com/512/2784/2784530.png"
       alt="提問專區">
  <span>提問專區</span>
</button>

  <div id="qaDrawer">
    <iframe
      id="qaFrame"
      src="https://script.google.com/macros/s/AKfycbxOwhSU7GaibGHNwatZFfylX0kg8Rh8fgaMjvVFheHv1cTzO5UnbG-B9_YIjpdShS2W_w/exec?id=12345689"
      frameborder="0">
    </iframe>
  </div>
<script>

// Google 試算表 CSV
const sheetUrl =
"https://docs.google.com/spreadsheets/d/1IIkNNVsf2vL6YM4tbCK80UPcHjHlrK6bXiIKP-e1qsw/gviz/tq?tqx=out:csv";

// 取得網址參數
const params = new URLSearchParams(window.location.search);

const targetPage =
    params.get("page") || "index";

const userId =
    params.get("id") || "";
    
const tier =
    params.get("tier") || "";
    
const provider =
    params.get("provider") || "";

console.log("tier =", tier);
console.log("targetPage =", targetPage);
console.log("userId =", userId);
console.log("provider =", provider);
    const drawer = document.getElementById('qaDrawer');
    const btn = document.getElementById('qaToggle');

    btn.addEventListener('click', () => {
      drawer.classList.toggle('open');
    });
// 讀取試算表
fetch(sheetUrl)
.then(res => res.text())
.then(csv => {

    const rows = csv.split("\n");

    for(let i = 1; i < rows.length; i++){

        const cols = rows[i].split(",");

        // A欄：檔名
        const fileName =
            cols[0]?.replace(/"/g,"").trim();

        // B欄：Apps Script URL
        const baseUrl =
            cols[1]?.replace(/"/g,"").trim();

        // C欄：page參數
        const pageValue =
            cols[2]?.replace(/"/g,"").trim();

        console.log("fileName =", fileName);

        if(fileName === targetPage){

            let finalUrl = baseUrl;

            // Verify_to_G：只帶 id
            if(fileName === "Verify_to_G"){

                finalUrl +=
                    `?id=${encodeURIComponent(userId)}`;

            }

            // sidebar、ManageMenu、Design、O_Menu
            else if(pageValue){

                finalUrl +=
        `${pageValue}` +
        `&id=${encodeURIComponent(userId)}` +
        `&tier=${encodeURIComponent(tier)}` +
        `&provider=${encodeURIComponent(provider)}`;
            }

            // index 不加任何參數

            console.log("finalUrl =", finalUrl);

            document.getElementById("pageFrame").src =
                finalUrl;

            break;
        }
    }

})
.catch(error => {
    console.error("讀取試算表失敗：", error);
});

</script>

</body>
</html>
